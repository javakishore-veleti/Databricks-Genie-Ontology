name: Setup Databricks env
description: Install uv/Python and write .env from the caller environment

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Sync Python package
      shell: bash
      run: uv sync
    - name: Write .env
      shell: bash
      run: python3 scripts/github-write-env.py

name: Generate Historical Data

on:
  workflow_dispatch:
    inputs:
      customers:
        description: Number of customers
        required: true
        default: "200"
        type: string
      orders_per_year:
        description: Orders per customer per year
        required: true
        default: "25000"
        type: string
      years:
        description: Years of history ending this month (1-3)
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: databricks-oltp-historical
  cancel-in-progress: false

jobs:
  generate-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_ACCOUNT_HOST: ${{ secrets.DATABRICKS_ACCOUNT_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_WORKSPACE_NAME: ${{ secrets.DATABRICKS_WORKSPACE_NAME }}
      DATABRICKS_AWS_REGION: ${{ secrets.DATABRICKS_AWS_REGION }}
      DATABRICKS_WORKSPACE_ADMIN_EMAILS: ${{ secrets.DATABRICKS_WORKSPACE_ADMIN_EMAILS }}
      DATABRICKS_WAREHOUSE_NAME: ${{ secrets.DATABRICKS_WAREHOUSE_NAME }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA: ${{ secrets.DATABRICKS_SCHEMA }}
      DATABRICKS_OLTP_SCHEMA: ${{ secrets.DATABRICKS_OLTP_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Databricks env
        uses: ./.github/actions/setup-databricks
      - name: Deploy Spark jobs
        run: uv run genie-ontology deploy
      - name: Generate historical OLTP
        run: >
          uv run genie-ontology run generate_historical --as-job
          --customers "${{ inputs.customers }}"
          --orders-per-year "${{ inputs.orders_per_year }}"
          --years "${{ inputs.years }}"

name: Create one Genie fraud agent

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
      agent_title:
        required: true
        type: string
      system_prompt:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  create-one-genie-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_ACCOUNT_HOST: ${{ secrets.DATABRICKS_ACCOUNT_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_WORKSPACE_NAME: ${{ secrets.DATABRICKS_WORKSPACE_NAME }}
      DATABRICKS_AWS_REGION: ${{ secrets.DATABRICKS_AWS_REGION }}
      DATABRICKS_WORKSPACE_ADMIN_EMAILS: ${{ secrets.DATABRICKS_WORKSPACE_ADMIN_EMAILS }}
      DATABRICKS_WAREHOUSE_NAME: ${{ secrets.DATABRICKS_WAREHOUSE_NAME }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA: ${{ secrets.DATABRICKS_SCHEMA }}
      DATABRICKS_OLTP_SCHEMA: ${{ secrets.DATABRICKS_OLTP_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Databricks env
        uses: ./.github/actions/setup-databricks
      - name: Create ${{ inputs.agent_title }} (Genie MCP)
        env:
          SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        run: >
          uv run genie-ontology run create_agents
          --agent-id "${{ inputs.agent_id }}"
          --system-prompt "$SYSTEM_PROMPT"

name: 02 - Fraud Agent - 10 - Fraud Geo Agent

on:
  workflow_dispatch:
    inputs:
      system_prompt:
        description: Override the Fraud Geo Agent system prompt. Leave empty to keep the default Case 15 notes.
        required: false
        default: ""
        type: string
      additional_prompt:
        description: Extra user prompt — comma-separated customer ids. Asked after any checked starter questions.
        required: false
        default: ""
        type: string
      ask_case_15:
        description: "Ask — Run fraud case 15 Impossible geo two regions one hour"
        type: boolean
        default: false
      ask_order_amount_timeseries:
        description: "Ask — Monthly time series aggregation of order_amount from customer_order table"
        type: boolean
        default: false
      ask_customer_segment:
        description: "Ask — Distribution of segment in the customer table"
        type: boolean
        default: false
      ask_tables_summary:
        description: "Ask — What tables are there and how are they connected? Give me a short summary."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    uses: ./.github/workflows/databricks-create-one-genie-agent.yml
    with:
      agent_id: geo
      agent_title: Fraud Geo Agent
      system_prompt: ${{ inputs.system_prompt }}
    secrets: inherit

  ask:
    needs: create
    if: >
      inputs.ask_case_15
      || inputs.ask_order_amount_timeseries
      || inputs.ask_customer_segment
      || inputs.ask_tables_summary
      || inputs.additional_prompt != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_ACCOUNT_HOST: ${{ secrets.DATABRICKS_ACCOUNT_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_WORKSPACE_NAME: ${{ secrets.DATABRICKS_WORKSPACE_NAME }}
      DATABRICKS_AWS_REGION: ${{ secrets.DATABRICKS_AWS_REGION }}
      DATABRICKS_WORKSPACE_ADMIN_EMAILS: ${{ secrets.DATABRICKS_WORKSPACE_ADMIN_EMAILS }}
      DATABRICKS_WAREHOUSE_NAME: ${{ secrets.DATABRICKS_WAREHOUSE_NAME }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA: ${{ secrets.DATABRICKS_SCHEMA }}
      DATABRICKS_OLTP_SCHEMA: ${{ secrets.DATABRICKS_OLTP_SCHEMA }}
      ADDITIONAL_PROMPT: ${{ inputs.additional_prompt }}
      ASK_CASE_15: ${{ inputs.ask_case_15 }}
      ASK_ORDER_AMOUNT_TIMESERIES: ${{ inputs.ask_order_amount_timeseries }}
      ASK_CUSTOMER_SEGMENT: ${{ inputs.ask_customer_segment }}
      ASK_TABLES_SUMMARY: ${{ inputs.ask_tables_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Databricks env
        uses: ./.github/actions/setup-databricks
      - name: Ask checked starter questions
        run: |
          ask() {
            uv run genie-ontology run invoke_agents --agent-id geo --question "$1"
          }
          if [ "$ASK_CASE_15" = "true" ]; then
            ask "Run fraud case 15 Impossible geo two regions one hour"
          fi
          if [ "$ASK_ORDER_AMOUNT_TIMESERIES" = "true" ]; then
            ask "Monthly time series aggregation of order_amount from customer_order table"
          fi
          if [ "$ASK_CUSTOMER_SEGMENT" = "true" ]; then
            ask "Distribution of segment in the customer table"
          fi
          if [ "$ASK_TABLES_SUMMARY" = "true" ]; then
            ask "What tables are there and how are they connected? Give me a short summary."
          fi
          if [ -n "$ADDITIONAL_PROMPT" ]; then
            ask "Run fraud case 15 Impossible geo two regions one hour for customer ids: ${ADDITIONAL_PROMPT}"
          fi

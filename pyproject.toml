[project]
name = "databricks-genie-ontology"
version = "0.1.0"
description = "Programmatic Databricks workflows that provision the ecommerce Genie Ontology demo, create Genie agents, and invoke them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "javakishore-veleti" }]
dependencies = [
    "databricks-sdk>=0.50.0",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2.0", "pyctuator>=1.2.0"]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
google-adk = ["google-adk>=1.15.0"]
agents = [
    "mcp>=2.2.0",
    "pyctuator>=1.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-adk>=1.15.0",
]

[project.scripts]
genie-ontology = "ecommerce_genie_ontology.cli:main"
genie-ontology-mcp = "ecommerce_genie_ontology.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_genie_ontology"]

[tool.uv]
package = true

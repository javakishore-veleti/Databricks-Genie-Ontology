  <text x="269" y="996" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">Amount vs baseline</text>
  <text x="269" y="1032" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Spend far above this customer's median.</text>
  <text x="269" y="1054" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Sudden origin-balance drain.</text>

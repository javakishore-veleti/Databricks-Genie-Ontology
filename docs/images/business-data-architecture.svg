<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1580" role="img" aria-labelledby="t d">
  <title id="t">Business data architecture</title>
  <desc id="d">Data owners, consumer MCP, Databricks Genie agents, and portal non-Genie agents.</desc>
  <rect width="1400" height="1580" fill="#f7fafc"/>
  <text x="48" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1e3a5f">Business data architecture</text>
  <text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5b6b80">Sales and funds-movement families share customer and date. Agents hydrate one customer at a time.</text>

  <rect x="40" y="110" width="1320" height="760" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="40" y="110" width="1320" height="72" rx="22" fill="#2563eb"/>
  <rect x="40" y="158" width="1320" height="24" fill="#2563eb"/>
  <text x="64" y="156" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Data owners</text>
  <text x="280" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Unity Catalog  ·  OLTP  ·  star serving layer</text>

  <text x="64" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Conformed dimensions</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a8a">
    <rect x="64" y="236" width="236" height="52" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <text x="182" y="268" text-anchor="middle">dim_customer</text>
    <rect x="316" y="236" width="236" height="52" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <text x="434" y="268" text-anchor="middle">dim_date</text>
    <rect x="568" y="236" width="236" height="52" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <text x="686" y="268" text-anchor="middle">dim_account</text>
    <rect x="820" y="236" width="236" height="52" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <text x="938" y="268" text-anchor="middle">dim_transaction_type</text>
    <rect x="1072" y="236" width="248" height="52" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <text x="1196" y="268" text-anchor="middle">dim_counterparty</text>
  </g>

  <rect x="64" y="320" width="616" height="516" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="372" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Sales family</text>
  <rect x="92" y="384" width="560" height="160" rx="14" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="372" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">OLTP sales</text>
  <text x="372" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">customer_order  ·  order_line  ·  shipment</text>
  <path d="M372 556 L372 588" stroke="#2563eb" stroke-width="3"/>
  <polygon points="364,588 380,588 372,600" fill="#2563eb"/>
  <rect x="92" y="608" width="560" height="196" rx="14" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="372" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Star facts</text>
  <text x="372" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">fact_sales  ·  fact_returns</text>

  <rect x="720" y="320" width="616" height="516" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1028" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Funds-movement family</text>
  <rect x="748" y="384" width="560" height="160" rx="14" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="1028" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">OLTP postings</text>
  <text x="1028" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">customer_transaction  ·  account  ·  type  ·  balances</text>
  <path d="M1028 556 L1028 588" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1020,588 1036,588 1028,600" fill="#2563eb"/>
  <rect x="748" y="608" width="560" height="196" rx="14" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="1028" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Star facts</text>
  <text x="1028" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">fact_transaction</text>

  <path d="M700 882 L700 924" stroke="#2563eb" stroke-width="3"/>
  <polygon points="692,924 708,924 700,936" fill="#2563eb"/>

  <rect x="40" y="948" width="1320" height="200" rx="20" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="64" y="988" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Consumer MCP  ·  customer first</text>
  <rect x="64" y="1012" width="400" height="108" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <circle cx="96" cy="1066" r="16" fill="#38bdf8"/>
  <text x="96" y="1072" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">list_customer_ids</text>
  <text x="128" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">IDs only for a date range</text>
  <rect x="500" y="1012" width="400" height="108" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <circle cx="532" cy="1066" r="16" fill="#38bdf8"/>
  <text x="532" y="1072" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="564" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Agent loop</text>
  <text x="564" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Parallel or sequential</text>
  <rect x="936" y="1012" width="400" height="108" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <circle cx="968" cy="1066" r="16" fill="#38bdf8"/>
  <text x="968" y="1072" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="1000" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Hydrate one customer</text>
  <text x="1000" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">get_customer_oltp  /  get_customer_star</text>

  <path d="M700 1160 L700 1200" stroke="#2563eb" stroke-width="3"/>
  <polygon points="692,1200 708,1200 700,1212" fill="#2563eb"/>

  <rect x="40" y="1224" width="640" height="320" rx="20" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="64" y="1264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Databricks Genie agents</text>
  <text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Workspace  ·  Unity Catalog</text>
  <rect x="64" y="1312" width="592" height="100" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="1354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Genie spaces query dims and facts in the workspace.</text>
  <text x="360" y="1380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Built for people asking natural-language questions.</text>
  <rect x="64" y="1432" width="592" height="80" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="360" y="1480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e3a8a">Does not go through the portal</text>

  <rect x="720" y="1224" width="640" height="320" rx="20" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="744" y="1264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Portal  ·  non-Genie agents</text>
  <text x="744" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Chat UI  ·  FastAPI middleware</text>
  <rect x="744" y="1316" width="592" height="56" rx="12" fill="#2563eb"/>
  <text x="1040" y="1352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">LangGraph  ’  MCP</text>
  <rect x="744" y="1384" width="592" height="56" rx="12" fill="#3b82f6"/>
  <text x="1040" y="1420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Google ADK  ’  MCP</text>
  <rect x="744" y="1452" width="592" height="56" rx="12" fill="#60a5fa"/>
  <text x="1040" y="1488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">AWS Strands  ’  MCP</text>

  <text x="48" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5b6b80">Customer on the left. Transaction types in the center. Banks on the right.</text>

  <rect x="48" y="120" width="320" height="640" rx="24" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="48" y="120" width="320" height="88" rx="24" fill="#0d9488"/>
  <rect x="48" y="184" width="320" height="24" fill="#0d9488"/>

  <text x="848" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Bank to bank, other account</text>
  <rect x="468" y="364" width="248" height="48" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="592" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Bank to bank, same account</text>

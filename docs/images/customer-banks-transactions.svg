  <rect x="468" y="236" width="248" height="48" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="592" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Wire transfer</text>
  <rect x="724" y="236" width="248" height="48" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="848" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Cash deposit</text>
  <rect x="468" y="300" width="248" height="48" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="592" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Cash withdrawal</text>

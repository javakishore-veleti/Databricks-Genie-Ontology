  <text x="848" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Same bank, same accounts</text>
  <rect x="468" y="428" width="248" height="48" rx="12" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="592" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Withdraw to CD</text>
  <rect x="724" y="428" width="248" height="48" rx="12" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="848" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Deposit into CD</text>
  <rect x="468" y="492" width="248" height="48" rx="12" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="592" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">From security brokerage</text>
  <rect x="724" y="492" width="248" height="48" rx="12" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="848" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">To security brokerage</text>
  <rect x="468" y="556" width="248" height="48" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="592" y="586" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Demand draft requested</text>
  <rect x="724" y="556" width="248" height="48" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="848" y="586" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Demand draft issued</text>
  <rect x="468" y="620" width="248" height="48" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <text x="592" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Credit card transaction</text>
  <rect x="724" y="620" width="248" height="48" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <text x="848" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f">Card payment and dues</text>
  <text x="720" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b80">class, direction, same_bank, same_account</text>

  <rect x="1072" y="120" width="320" height="640" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="1072" y="120" width="320" height="88" rx="24" fill="#2563eb"/>
  <rect x="1072" y="184" width="320" height="24" fill="#2563eb"/>
  <text x="1232" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Banks</text>
  <rect x="1104" y="236" width="256" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1232" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e3a8a">Same bank</text>
  <text x="1232" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">own accounts, book entry</text>
  <rect x="1104" y="340" width="256" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1232" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e3a8a">Other bank</text>
  <text x="1232" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">wire, bank-to-bank</text>
  <rect x="1104" y="444" width="256" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1232" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e3a8a">Brokerage</text>
  <text x="1232" y="508" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">securities in and out</text>
  <rect x="1104" y="548" width="256" height="88" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1232" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e3a8a">Card issuer</text>
  <text x="1232" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">purchase, payment, dues</text>
  <text x="1232" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b80">counterparty on the posting</text>

